<p style="margin: 0; max-width: 680px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">Upload one sequence, or several, as Isodat exported them. The server deletes each file before it sends its reply, and nothing is kept. Each correction uses the standards in the same run, and when you change a choice in a later step, your browser recalculates the values.</p>
</div>
<button type="button" onClick="{{up.choose}}" disabled="{{up.busy}}" aria-describedby="dc-drop-note" style="font: inherit; min-height: 220px; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; background: {{up.dropBg}}; border: 1.5px dashed {{up.dropBd}}; border-radius: 4px; color: #13212B; cursor: {{up.dropCursor}}" style-hover="border-color: #13212B; background: #F8FAFB">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 27V8M12 15.5l8-8 8 8M8 26v7h24v-7" fill="none" stroke="#13212B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 18px; font-weight: 600; overflow-wrap: anywhere">{{up.dropTitle}}</span>
<span id="dc-drop-note" style="max-width: 560px; font-size: 14px; line-height: 1.5; color: #4A5A66">{{up.dropNote}}</span>
</button>
<input id="dc-export" type="file" accept=".xls,.xlsx,.xlsm,.csv,.txt,.tsv" multiple hidden onchange="{{up.picked}}">
<section aria-label="Options" style="padding: 16px 18px; background: #FFFFFF; border: 1px solid #D9E0E5; border-radius: 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px 32px">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Lab configuration <span style="font-weight: 400; color: #4A5A66">(optional)</span></span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; overflow-wrap: anywhere">{{up.cfgName}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{up.chooseCfg}}" disabled="{{up.busy}}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 7px 14px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">{{up.cfgButton}}</button>
<sc-if value="{{up.hasCfg}}"><button type="button" onClick="{{up.clearCfg}}" disabled="{{up.busy}}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 7px 14px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">Use the package defaults</button></sc-if>
<button type="button" onClick="{{up.template}}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 7px 14px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #0B5E8E; text-decoration: underline; text-underline-offset: 3px; cursor: pointer" style-hover="color: #13212B">Download the template</button>
</div>
<span style="font-size: 13.5px; line-height: 1.5; color: #4A5A66">{{up.cfgNote}}</span>
<input id="dc-config" type="file" accept=".xlsx,.json,application/json" hidden onchange="{{up.pickedCfg}}">
</div>
<label style="min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600">
<span style="overflow-wrap: anywhere">{{up.dateLabel}} <span style="font-weight: 400; color: #4A5A66">(optional)</span></span>
<input id="dc-date" type="date" value="{{up.dateValue}}" oninput="{{up.setDate}}" disabled="{{up.busy}}" style="font: inherit; font-size: 15px; font-weight: 400; width: 100%; max-width: 240px; min-height: 44px; padding: 8px 12px; box-sizing: border-box; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B">
<span style="font-size: 13.5px; font-weight: 400; line-height: 1.5; color: #4A5A66">{{up.dateNote}}</span>
</label>
<div role="group" aria-label="{{up.infoLabel}}" style="min-width: 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600; overflow-wrap: anywhere">{{up.infoLabel}} <span style="font-weight: 400; color: #4A5A66">(optional)</span></span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 8px 10px">
<sc-for list="{{up.infoFields}}" as="f"><label style="min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-weight: 600; color: #22313B">{{f.label}}<input id="{{f.id}}" type="text" value="{{f.value}}" oninput="{{f.set}}" disabled="{{up.busy}}" maxlength="500" autocomplete="off" style="font: inherit; font-size: 14.5px; font-weight: 400; width: 100%; min-height: 40px; padding: 7px 10px; box-sizing: border-box; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B"></label></sc-for>
</div>
<sc-if value="{{up.canInfoAll}}"><div><button type="button" onClick="{{up.infoAll}}" disabled="{{up.busy}}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 7px 14px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #0B5E8E; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding-left: 0" style-hover="color: #13212B">Use for every run</button></div></sc-if>
<span style="font-size: 13.5px; line-height: 1.5; color: #4A5A66">{{up.infoNote}}</span>
</div>
</section>
<section aria-label="Sample sheet" style="padding: 16px 18px; background: #FFFFFF; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Sample sheet <span style="font-weight: 400; color: #4A5A66">(optional)</span></span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; overflow-wrap: anywhere">{{up.sheet.name}}</span>
<sc-if value="{{up.sheet.has}}"><span style="font-size: 13.5px; color: #4A5A66">{{up.sheet.meta}}</span></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{up.sheet.choose}}" disabled="{{up.busy}}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 7px 14px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">{{up.sheet.button}}</button>
<sc-if value="{{up.sheet.has}}"><button type="button" onClick="{{up.sheet.clear}}" disabled="{{up.busy}}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 7px 14px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">Remove the sheet</button></sc-if>
<button type="button" onClick="{{up.sheet.template}}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 7px 14px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #0B5E8E; text-decoration: underline; text-underline-offset: 3px; cursor: pointer" style-hover="color: #13212B">{{up.sheet.templateLabel}}</button>
</div>
<span style="font-size: 13.5px; line-height: 1.5; color: #4A5A66">{{up.sheet.note}}</span>
<input id="dc-sheet" type="file" accept=".xlsx,.xlsm,.xls,.csv,.tsv,.txt" hidden onchange="{{up.sheet.picked}}">
<sc-if value="{{up.sheet.has}}">
<label style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; font-weight: 600">ID column
<select id="dc-sheet-id" onchange="{{up.sheet.pickId}}" disabled="{{up.busy}}" style="font: inherit; font-size: 14px; font-weight: 400; min-height: 38px; max-width: 100%; padding: 6px 10px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B"><sc-for list="{{up.sheet.cols}}" as="o"><option value="{{o.v}}" selected="{{o.sel}}">{{o.t}}</option></sc-for></select></label>
<p data-dc="sheet-summary" style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #22313B">{{up.sheet.summary}}</p>
<sc-if value="{{up.sheet.hasNotes}}"><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4A5A66">{{up.sheet.notes}}</p></sc-if>
<sc-if value="{{up.sheet.written}}"><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4A5A66">{{up.sheet.written}}</p></sc-if>
<sc-if value="{{up.sheet.hasRows}}">
<div class="dc-scroll" tabindex="0" role="region" aria-label="How each sample matched the sheet, a list that scrolls" style="overflow: auto; max-height: 360px; border: 1px solid #D9E0E5; border-radius: 4px">
<div role="table" aria-label="How each sample matched the sheet" style="min-width: 560px; font-size: 13.5px">
<div role="row" style="position: sticky; top: 0; display: grid; grid-template-columns: {{up.sheet.grid}}; gap: 10px; padding: 7px 12px; background: #F4F6F8; border-bottom: 1px solid #E3E8EC; font-size: 13px; font-weight: 600; color: #4A5A66"><span role="columnheader" style="display: {{up.sheet.runCell}}">Run</span><span role="columnheader">Position</span><span role="columnheader">Sample name</span><span role="columnheader">Sample ID</span><span role="columnheader">Matched by</span><span role="columnheader">Replicates</span></div>
<sc-for list="{{up.sheet.rows}}" as="m"><div role="row" style="display: grid; grid-template-columns: {{up.sheet.grid}}; gap: 10px; align-items: center; padding: 5px 12px; border-bottom: 1px solid #ECF0F3"><span role="cell" style="display: {{up.sheet.runCell}}; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #4A5A66">{{m.run}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace">{{m.row}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; overflow-wrap: anywhere">{{m.id}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; overflow-wrap: anywhere">{{m.sid}}</span><span role="cell" style="color: {{m.fg}}; font-weight: 600">{{m.how}}</span><span role="cell" style="color: #4A5A66">{{m.group}}</span></div></sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{up.sheet.hasMore}}"><p style="margin: 0; font-size: 13.5px; color: #4A5A66">{{up.sheet.more}}</p></sc-if>
</sc-if>
</section>
<sc-if value="{{up.hasError}}">
<div role="alert" tabindex="-1" data-dc="error-box" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #FDF1EC; border: 1px solid #E3B3A0; border-radius: 4px; outline: none">
<strong style="font-size: 15px; font-weight: 600; color: #A33A00; overflow-wrap: anywhere">{{up.errTitle}}</strong>
<span data-dc="error-detail" style="font-size: 14.5px; line-height: 1.55; color: #22313B; white-space: pre-wrap; overflow-wrap: anywhere">{{up.errText}}</span>
</div>
</sc-if>
<sc-if value="{{up.multi}}">
<section aria-label="Runs in this batch" style="padding: 16px 18px; background: #FFFFFF; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px"><h2 style="margin: 0; font-size: 16px; font-weight: 600">{{up.batchTitle}}</h2><span style="font-size: 13.5px; color: #4A5A66">{{up.batchNote}}</span></div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{up.runs}}" as="r"><li aria-current="{{r.cur}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 10px; border-radius: 4px; background: {{r.bg}}; border-bottom: 1px solid #ECF0F3">
<span style="flex: 0 0 auto; min-width: 22px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #4A5A66">{{r.n}}</span>
<span style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; overflow-wrap: anywhere">{{r.name}}</span><span style="font-size: 13px; color: #4A5A66">{{r.meta}}</span></span>
<span style="flex: 0 1 auto; font-size: 13px; font-weight: 600; color: {{r.sfg}}">{{r.status}}</span>
<span style="flex: 0 0 auto; display: flex; gap: 6px"><button type="button" onClick="{{r.open}}" disabled="{{r.isCur}}" aria-label="{{r.openT}} {{r.name}}" style="font: inherit; font-size: 13.5px; font-weight: 600; min-height: 34px; padding: 5px 12px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">{{r.openT}}</button><button type="button" onClick="{{r.remove}}" disabled="{{r.busy}}" aria-label="Remove {{r.name}}" style="font: inherit; font-size: 13.5px; font-weight: 600; min-height: 34px; padding: 5px 12px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">Remove</button></span>
</li></sc-for>
</ol>
</section>
</sc-if>
<sc-if value="{{up.has}}">
<section style="padding: 18px 20px; background: #FFFFFF; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M8 3h12l7 7v21H8z" fill="#EEF2F5" stroke="#13212B" stroke-width="1.6" stroke-linejoin="round"></path><path d="M20 3v7h7M12 18h10M12 22h10M12 26h6" fill="none" stroke="#13212B" stroke-width="1.6" stroke-linecap="round"></path></svg>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column">
<span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 600; overflow-wrap: anywhere">{{up.name}}</span>
<span style="font-size: 14px; color: #4A5A66">{{up.meta}}</span>
</div>
<span style="padding: 4px 11px; border-radius: 3px; background: #DDF2EA; color: #0B6E4F; font-size: 13px; font-weight: 600">{{up.badge}}</span>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{up.checks}}" as="k"><li style="display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.5; color: #22313B"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px"><circle cx="10" cy="10" r="8" fill="none" stroke="{{k.c}}" stroke-width="1.6"></circle><path d="{{k.d}}" fill="none" stroke="{{k.c}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>{{k.t}}</span></li></sc-for>
</ul>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Columns</h2>
<span style="font-size: 13.5px; color: #4A5A66">{{up.mapNote}}</span>
</div>
<div class="dc-scroll" tabindex="0" role="region" aria-label="Column mapping, a table that scrolls sideways" style="overflow-x: auto; border: 1px solid #D9E0E5; border-radius: 4px">
<div role="table" aria-label="Column mapping" style="min-width: 560px; font-size: 14px">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 0.9fr); gap: 10px; padding: 8px 14px; background: #F4F6F8; border-bottom: 1px solid #E3E8EC; font-size: 13px; font-weight: 600; color: #4A5A66"><span role="columnheader">What ea_irms needs</span><span role="columnheader">Column in this file</span><span role="columnheader">Match</span></div>
<sc-for list="{{up.cols}}" as="c"><div role="row" style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 0.9fr); gap: 10px; align-items: center; padding: 7px 14px; border-bottom: 1px solid #ECF0F3"><span role="cell">{{c.field}} <span style="color: #56646F">{{c.unit}}</span></span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; white-space: pre">{{c.col}}</span><span role="cell" style="color: #0B6E4F; font-size: 13.5px; font-weight: 600">{{c.how}}</span></div></sc-for>
</div>
</div>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4A5A66">{{up.mapFoot}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px">
<div style="padding: 10px 12px; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #56646F">Instrument</span><span style="font-weight: 600">EA-IRMS</span></div>
<div style="padding: 10px 12px; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #56646F">Starting configuration</span><span style="font-weight: 600; overflow-wrap: anywhere">{{up.cfgShort}}</span></div>
<div style="padding: 10px 12px; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #56646F">Run date</span><span style="font-weight: 600">{{up.date}}</span></div>
</div>
<div style="display: flex; justify-content: flex-end"><button type="button" onClick="{{up.start}}" disabled="{{up.busy}}" style="font: inherit; font-size: 15px; font-weight: 600; min-height: 46px; padding: 11px 20px; border: 0; border-radius: 4px; background: #13212B; color: #FFFFFF; cursor: pointer" style-hover="background: #22374B">Start the corrections</button></div>
</section>
</sc-if>
<p style="margin: 0; max-width: 760px; font-size: 13.5px; line-height: 1.55; color: #4A5A66">Your browser keeps the exports, and the sample sheet if you chose one, in this tab, so that it can send them again when you download a workbook or the results.</p>
<sc-if value="{{up.fresh}}">
<section aria-label="The nine steps" style="display: flex; flex-direction: column; gap: 8px; padding-top: 28px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size:34px; line-height: 1.15">The nine steps</h2>
<p style="margin: 0 0 14px; max-width: 680px; font-size:17px; color: #3B4A55">Step 1 checks the instrument, and steps 2 to 9 follow the order of the correction workbook that ea_irms writes. Each step shows its numbers and how it reaches them, and you can change its choice before you go on.</p>
<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); column-gap: 48px; font-size:16px">
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #C2510A; min-width: 28px">1</span><span><strong style="font-weight: 600">Instrument performance.</strong> How steady the reference gas was, and when the background settled.</span></li>
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #0B5E8E; min-width: 28px">2</span><span><strong style="font-weight: 600">Standards and roles.</strong> Which positions are standards, blanks, and samples.</span></li>
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #0B5E8E; min-width: 28px">3</span><span><strong style="font-weight: 600">Blank.</strong> What the empty capsules add, and whether to subtract it.</span></li>
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #0B5E8E; min-width: 28px">4</span><span><strong style="font-weight: 600">Linearity.</strong> Whether δ changes with peak size.</span></li>
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #0B5E8E; min-width: 28px">5</span><span><strong style="font-weight: 600">Drift.</strong> Whether the instrument drifted during the run.</span></li>
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #0B5E8E; min-width: 28px">6</span><span><strong style="font-weight: 600">Calibration.</strong> Reference materials with known values put the run on the AIR and VPDB scales.</span></li>
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #0B5E8E; min-width: 28px">7</span><span><strong style="font-weight: 600">Elemental content.</strong> %N and %C from peak areas and sample weights.</span></li>
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #0B5E8E; min-width: 28px">8</span><span><strong style="font-weight: 600">Uncertainty.</strong> The uncertainty of each sample value, as 1σ.</span></li>
<li style="display: flex; gap: 18px; padding: 14px 0; border-top: 1px solid #D9E0E5"><span style="font-family: 'Newsreader', Georgia, serif; font-size:26px; line-height: 1; color: #0B5E8E; min-width: 28px">9</span><span><strong style="font-weight: 600">Quality checks.</strong> The checks of every step in one list, with a link back to each step.</span></li>
</ol>
</section>
</sc-if>
</div>
</sc-if>

<sc-if value="{{is.flow}}">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 28px">
<aside style="flex: 1 1 236px; min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 14px">
<div style="padding: 14px 16px; background: #FFFFFF; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #56646F">{{flow.runLabel}}</span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere">{{flow.file}}</span>
<span style="font-size: 13.5px; color: #4A5A66">{{up.positions}} positions · {{up.date}}</span>
<sc-if value="{{flow.multi}}"><nav aria-label="Runs" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #E3E8EC; display: flex; flex-direction: column; gap: 2px"><sc-for list="{{flow.runs}}" as="r"><button type="button" onClick="{{r.pick}}" disabled="{{r.busy}}" aria-current="{{r.cur}}" style="font: inherit; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; text-align: left; min-height: 32px; padding: 5px 8px; border: 0; border-radius: 3px; background: {{r.bg}}; color: {{r.fg}}; overflow-wrap: anywhere; cursor: pointer" style-hover="text-decoration: underline">{{r.t}}</button></sc-for></nav></sc-if>
<sc-if value="{{flow.warn}}"><span style="margin-top: 4px; padding: 6px 8px; border-radius: 3px; background: #FADFD2; color: #A33A00; font-size: 13px; line-height: 1.4">{{flow.warnText}}</span></sc-if>
</div>
<nav aria-label="Correction steps">
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{flow.rail}}" as="s"><li><button type="button" onClick="{{s.pick}}" aria-current="{{s.cur}}" style="font: inherit; width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 9px 10px; text-align: left; background: {{s.rbg}}; border: 1px solid {{s.rbd}}; border-radius: 4px; color: #13212B; cursor: pointer" style-hover="background: #FFFFFF"><span style="flex: 0 0 auto; box-sizing: border-box; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; background: {{s.nbg}}; color: {{s.nfg}}; border: 1.5px solid {{s.nbd}}">{{s.n}}</span><span style="min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: {{s.tw}}">{{s.t}}</span><span style="font-size: 13px; line-height: 1.4; color: #4A5A66">{{s.sub}}</span></span></button></li></sc-for>
</ol>
</nav>
</aside>
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px 24px">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #C2510A">{{flow.kicker}}</span>
<sc-if value="{{is.inst}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Instrument performance</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">This step checks the instrument before any correction, and nothing on this screen changes a value. Isodat calculates each analysis against one reference gas pulse, the one it marks with the Is Ref flag. The other reference pulses are measured the same way, so their spread shows the instrument’s precision without any sample. BGD 28 is the background at m/z 28 under each peak, and analyses made before it settled are flagged; BGD 44 and retention times are not read.</p></sc-if>
<sc-if value="{{is.setup}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Standards and roles</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">Each sample name (Identifier 1) is matched to the standards table by its text, and upper and lower case count as the same. If two rows match, the lower row is used. Positions that match no row are treated as samples.</p></sc-if>
<sc-if value="{{is.blank}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Blank</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">Empty tin capsules show how much the capsule and the system add to every peak. On Auto, the blank is subtracted only if at least three capsules gave a peak and their δ values agree within 2‰ (1 SD). {{text.blankFlag}}</p></sc-if>
<sc-if value="{{is.lin}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Linearity</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">{{text.linSeries}} is one standard run at several sizes, so it shows whether δ changes with peak size. On Auto, the correction is applied only if the slope differs from zero at p &lt; {{text.alpha}}. A peak with the series’ mean area is not changed, and larger or smaller peaks are moved along the slope. Peaks outside the size range of the series are extrapolated and flagged.</p></sc-if>
<sc-if value="{{is.drift}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Drift</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">{{text.monitors}} are one standard placed at intervals through the run, so they show whether the instrument drifted. On Auto, the correction is applied only if the slope differs from zero at p &lt; {{text.alpha}}. Click a monitor on a chart to leave it out of the fit, and click it again to put it back.</p></sc-if>
<sc-if value="{{is.cal}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Calibration</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">{{text.anchors}} are reference materials with accepted values, and they put the run on the AIR and VPDB scales. A straight line is fitted with the accepted values against the measured ones, and that line converts each sample directly. Samples outside the range of the anchors are extrapolated, and their uncertainty grows with the distance.</p></sc-if>
<sc-if value="{{is.elem}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Elemental content</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">The weighed standards give a k-factor that turns peak area into micrograms of N and C. If the instrument’s sensitivity changes during the run, the drift monitors read too high or too low in %N and %C. The correction divides each position’s %N and %C by the monitors’ factor at that point in the run, interpolated between monitors and held constant before the first and after the last. On Auto, it is applied when a monitor is off by more than {{text.elemGate}}%. Click a monitor to leave it out.</p></sc-if>
<sc-if value="{{is.unc}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Uncertainty</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">Each value has an uncertainty of one standard deviation, 1σ. It combines the uncertainty of the anchors’ certified values, the standard errors of their measured means, and the repeatability of a single analysis, carried through the calibration line as in a Kragten spreadsheet. 1σ does not include the blank, linearity, or drift corrections, or differences between runs. Where a step counts the samples that a choice would move by more than their uncertainty, it uses {{text.k}}σ.</p></sc-if>
<sc-if value="{{is.qc}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Quality checks</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">Each check below is shown in its own step and changes no value; this list gathers them for the whole run, with a button back to each step. A Caution means that reversing a linearity or drift choice would move a sample by more than {{text.k}}σ, or that a monitor used for elemental content is off by more than 10%, and a Note marks anything else to look at.</p></sc-if>
<sc-if value="{{is.results}}"><h1 tabindex="-1" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:clamp(34px, 3.6vw, 46px); line-height: 1.08; font-weight: 500; letter-spacing: -0.01em">Results</h1><p style="margin: 0; max-width: 780px; font-size: 16px; line-height: 1.6; color: #3B4A55; text-wrap: pretty">Corrected values for every sample, with 1σ, %N, %C, and C:N. Click a row or a point to see each step of its correction.</p></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{flow.prev.pick}}" style="font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 10px 16px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">{{flow.prev.t}}</button>
<button type="button" onClick="{{flow.next.pick}}" disabled="{{flow.next.busy}}" style="font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 4px; background: #13212B; color: #FFFFFF; cursor: pointer" style-hover="background: #22374B">{{flow.next.t}}</button>
</div>
</div>

<sc-if value="{{flow.hasCtrl}}">
<section aria-label="Decisions" style="padding: 16px 18px; background: #F5F7F9; border-radius: 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px 32px">
<sc-for list="{{flow.ctrl}}" as="k">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<span style="min-width: 116px; font-size: 15px; font-weight: 600">{{k.label}}</span>
<div role="group" aria-label="{{k.label}}" style="display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: #EEF2F5; border-radius: 4px">
<sc-for list="{{k.opts}}" as="o"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 36px; padding: 7px 14px; border: 0; border-radius: 3px; background: {{o.bg}}; color: {{o.fg}}; cursor: pointer">{{o.t}}</button></sc-for>
</div>
</div>
<sc-for list="{{k.lines}}" as="l"><div style="display: flex; align-items: baseline; gap: 8px; font-size: 14px; line-height: 1.5; color: #3B4A55"><span style="flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: {{l.dot}}"></span><span>{{l.t}}</span></div></sc-for>
</div>
</sc-for>
</section>
</sc-if>

<sc-if value="{{is.step}}">
<section aria-label="Sequence" style="padding: 14px 18px 12px; background: #F5F7F9; border-radius: 4px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Sequence <span style="font-weight: 400; color: #4A5A66">Bar height is the N₂ peak area on a log scale. Click a bar to see that position.</span></h2>
<div style="display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: #3B4A55"><sc-for list="{{flow.legend}}" as="l"><span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 2px; background: {{l.bg}}"></span>{{l.t}}</span></sc-for></div>
</div>
<div class="dc-ribbon" role="toolbar" aria-label="Positions in the sequence; the arrow keys move along it" style="display: flex; align-items: flex-end; gap: 2px; height: 64px">
<sc-for list="{{flow.ribbon}}" as="b"><button type="button" class="dc-hit" onClick="{{b.pick}}" onkeydown="{{b.key}}" tabindex="{{b.tab}}" aria-current="{{b.cur}}" title="{{b.label}}" aria-label="{{b.label}}" style="flex: 1 1 0; min-width: 0; height: 64px; padding: 0; border: 0; border-radius: 3px; background: {{b.sbg}}; display: flex; align-items: flex-end; cursor: pointer" style-hover="background: #E3E9EF"><span style="display: block; width: 100%; height: {{b.h}}px; background: {{b.bg}}; opacity: {{b.op}}; border-radius: 2px 2px 0 0"></span></button></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #56646F"><span>{{flow.ribbonStart}}</span><span>{{flow.ribbonEnd}}</span></div>
</section>
</sc-if>

<sc-if value="{{is.setup}}">
<section aria-label="Standards table" style="background: #FFFFFF; border-top: 2px solid #13212B; border-bottom: 2px solid #13212B; overflow: hidden">
<div style="padding: 16px 18px 10px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Standards table</h2>
<span style="font-size: 13.5px; color: #4A5A66">{{flow.stdSource}} Accepted δ in ‰, with the certificates’ 1σ. Gray rows match no position in this run.</span>
</div>
<div class="dc-scroll" tabindex="0" role="region" aria-label="Standards table, which scrolls sideways" style="overflow-x: auto">
<div role="table" aria-label="Standards table" style="min-width: 780px; font-size: 14px">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.2fr) repeat(4, minmax(0, 0.75fr)) minmax(0, 1fr) minmax(0, 0.8fr); gap: 10px; padding: 8px 18px; background: #F4F6F8; border-top: 1px solid #E3E8EC; border-bottom: 1px solid #E3E8EC; font-size: 13px; font-weight: 600; color: #4A5A66"><span role="columnheader">Match text</span><span role="columnheader">Role</span><span role="columnheader">δ¹³C</span><span role="columnheader">δ¹⁵N</span><span role="columnheader">%C</span><span role="columnheader">%N</span><span role="columnheader">1σ(δ¹³C), 1σ(δ¹⁵N)</span><span role="columnheader">Positions</span></div>
<sc-for list="{{flow.setupRows}}" as="r"><div role="row" style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.2fr) repeat(4, minmax(0, 0.75fr)) minmax(0, 1fr) minmax(0, 0.8fr); gap: 10px; padding: 8px 18px; border-bottom: 1px solid #ECF0F3; opacity: {{r.op}}"><span role="cell" style="font-weight: 500">{{r.text}}</span><span role="cell" style="display: inline-flex; align-items: center; gap: 7px"><span style="flex: 0 0 auto; width: 9px; height: 9px; border-radius: 2px; background: {{r.bg}}"></span>{{r.role}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px">{{r.d13}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px">{{r.d15}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px">{{r.pc}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px">{{r.pn}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px">{{r.u}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; font-weight: {{r.fw}}">{{r.n}}</span></div></sc-for>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{flow.hasChecks}}">
<section aria-label="Checks" style="background: #FFFFFF; border-top: 2px solid #13212B; border-bottom: 1px solid #D9E0E5; padding: 0">
<sc-for list="{{flow.checks}}" as="k"><div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; padding: 13px 18px; border-bottom: 1px solid #ECF0F3"><span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-width: 96px; box-sizing: border-box; padding: 3px 10px 3px 5px; border-radius: 3px; background: {{k.bg}}; color: {{k.fg}}; font-size: 13px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="{{k.icon}}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{k.label}}</span><div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px; font-weight: 600">{{k.title}}</strong><span style="font-size: 14px; line-height: 1.55; color: #3B4A55">{{k.t}}</span></div><sc-if value="{{k.hasGo}}"><button type="button" onClick="{{k.go}}" style="font: inherit; font-size: 14px; font-weight: 600; align-self: center; padding: 6px 12px; border: 1px solid #B9C4CC; border-radius: 8px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">{{k.goText}}</button></sc-if></div></sc-for>
</section>
</sc-if>

<sc-if value="{{flow.hasCharts}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 20px">
<sc-for list="{{flow.charts}}" as="c">
<figure class="dc-figure" style="margin: 0; min-width: 0; background: #FFFFFF; border-top: 2px solid #13212B; padding: 14px 2px 6px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 6px 12px">
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<h3 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size:20px; font-weight: 500; line-height: 1.3"><span style="font-family: 'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Helvetica, system-ui, sans-serif; font-size:15px; font-weight: 700; color: #C2510A">Fig. {{c.num}}</span> {{c.title}}</h3>
<span style="font-size: 13.5px; line-height: 1.45; color: #56646F">{{c.sub}}</span>
</div>
<sc-if value="{{c.hasBadge}}"><span style="flex: 0 0 auto; padding: 4px 10px; border-radius: 3px; font-size: 13px; font-weight: 600; white-space: nowrap; background: {{c.badge.bg}}; color: {{c.badge.fg}}">{{c.badge.text}}</span></sc-if>
</div>
<sc-if value="{{c.full}}">
<span style="font-size: 13px; color: #3B4A55">{{c.yLabel}}</span>
<div role="group" aria-label="{{c.pointsLabel}}" style="position: relative; width: 100%; aspect-ratio: {{c.ar}}; margin-bottom: 18px">
<svg viewBox="{{c.vb}}" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible">
<path d="{{c.s0.d}}" fill="{{c.s0.f}}" stroke="{{c.s0.s}}" stroke-width="{{c.s0.w}}" stroke-dasharray="{{c.s0.da}}"></path>
<path d="{{c.s1.d}}" fill="{{c.s1.f}}" stroke="{{c.s1.s}}" stroke-width="{{c.s1.w}}" stroke-dasharray="{{c.s1.da}}"></path>
<path d="{{c.s2.d}}" fill="{{c.s2.f}}" stroke="{{c.s2.s}}" stroke-width="{{c.s2.w}}" stroke-dasharray="{{c.s2.da}}"></path>
<path d="{{c.s3.d}}" fill="{{c.s3.f}}" stroke="{{c.s3.s}}" stroke-width="{{c.s3.w}}" stroke-dasharray="{{c.s3.da}}"></path>
<path d="{{c.s4.d}}" fill="{{c.s4.f}}" stroke="{{c.s4.s}}" stroke-width="{{c.s4.w}}" stroke-dasharray="{{c.s4.da}}"></path>
<path d="{{c.s5.d}}" fill="{{c.s5.f}}" stroke="{{c.s5.s}}" stroke-width="{{c.s5.w}}" stroke-dasharray="{{c.s5.da}}"></path>
<path d="{{c.s6.d}}" fill="{{c.s6.f}}" stroke="{{c.s6.s}}" stroke-width="{{c.s6.w}}" stroke-dasharray="{{c.s6.da}}"></path>
<path d="{{c.s7.d}}" fill="{{c.s7.f}}" stroke="{{c.s7.s}}" stroke-width="{{c.s7.w}}" stroke-dasharray="{{c.s7.da}}"></path>
<path d="{{c.s8.d}}" fill="{{c.s8.f}}" stroke="{{c.s8.s}}" stroke-width="{{c.s8.w}}" stroke-dasharray="{{c.s8.da}}"></path>
<path d="{{c.s9.d}}" fill="{{c.s9.f}}" stroke="{{c.s9.s}}" stroke-width="{{c.s9.w}}" stroke-dasharray="{{c.s9.da}}"></path>
<path d="{{c.s10.d}}" fill="{{c.s10.f}}" stroke="{{c.s10.s}}" stroke-width="{{c.s10.w}}" stroke-dasharray="{{c.s10.da}}"></path>
<path d="{{c.s11.d}}" fill="{{c.s11.f}}" stroke="{{c.s11.s}}" stroke-width="{{c.s11.w}}" stroke-dasharray="{{c.s11.da}}"></path>
</svg>
<sc-for list="{{c.yl}}" as="t"><span style="position: absolute; left: {{t.x}}%; top: {{t.y}}%; transform: translate(calc(-100% - 7px), -50%); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #56646F; white-space: nowrap">{{t.t}}</span></sc-for>
<sc-for list="{{c.xl}}" as="t"><span style="position: absolute; left: {{t.x}}%; top: {{t.y}}%; transform: translate(-50%, 6px); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #56646F; white-space: nowrap">{{t.t}}</span></sc-for>
<sc-for list="{{c.notes}}" as="t"><span style="position: absolute; left: {{t.x}}%; top: {{t.y}}%; transform: {{t.tf}}; font-size: 12.5px; font-weight: 600; color: {{t.c}}; white-space: nowrap; pointer-events: none">{{t.t}}</span></sc-for>
<sc-for list="{{c.hits}}" as="h"><button type="button" class="dc-hit" onClick="{{h.pick}}" onkeydown="{{h.key}}" tabindex="{{h.tab}}" title="{{h.label}}" aria-label="{{h.label}}" style="position: absolute; left: {{h.x}}%; top: {{h.y}}%; width: {{h.size}}; aspect-ratio: 1; transform: translate(-50%, -50%); padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer" style-hover="background: rgba(14, 26, 38, 0.08)"></button></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px">

<h2 style="margin: 0; font-size: 16px; font-weight: 600">Summary</h2>
<div role="table" style="display: flex; flex-direction: column; font-size: 14px">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid #D9E0E5; font-size: 13px; font-weight: 600; color: #4A5A66"><span role="columnheader"><span class="dc-sr">Quantity</span></span><span role="columnheader">{{flow.statA}}</span><span role="columnheader">{{flow.statB}}</span></div>
<sc-for list="{{flow.stats.rows}}" as="r"><div role="row" style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid #ECF0F3"><span role="rowheader" style="color: #3B4A55">{{r.k}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; overflow-wrap: anywhere">{{r.a}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; overflow-wrap: anywhere">{{r.b}}</span></div></sc-for>
</div>
</section>
</sc-if>
<sc-if value="{{flow.hasEffect}}">
<section aria-label="{{flow.effect.title}}" style="min-width: 0; padding: 16px 18px; background: #FFFFFF; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">{{flow.effect.title}}</h2>
<sc-for list="{{flow.effect.lines}}" as="l"><p style="margin: 0; font-size: 14.5px; line-height: 1.6; color: #22313B">{{l.t}}</p></sc-for>
</section>
</sc-if>
<sc-if value="{{flow.hasBudget}}">
<section aria-label="Sources of uncertainty" style="min-width: 0; padding: 16px 18px; background: #FFFFFF; border: 1px solid #D9E0E5; border-radius: 4px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Sources of uncertainty <span style="font-weight: 400; color: #4A5A66">{{flow.budget.title}}, share of the variance</span></h2>
<sc-for list="{{flow.budget.rows}}" as="r"><div style="display: flex; flex-direction: column; gap: 5px; padding: 6px 0; border-bottom: 1px solid #ECF0F3"><span style="font-size: 14px; color: #22313B">{{r.k}}</span><div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 40px; align-items: center; gap: 8px; font-size: 13px; color: #4A5A66"><span>δ¹⁵N</span><span style="height: 8px; border-radius: 4px; background: #E3E8EC; overflow: hidden"><span style="display: block; height: 100%; width: {{r.wn}}; background: #0072B2"></span></span><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace">{{r.n}}</span></div><div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 40px; align-items: center; gap: 8px; font-size: 13px; color: #4A5A66"><span>δ¹³C</span><span style="height: 8px; border-radius: 4px; background: #E3E8EC; overflow: hidden"><span style="display: block; height: 100%; width: {{r.wc}}; background: #D55E00"></span></span><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace">{{r.c}}</span></div></div></sc-for>
</section>
</sc-if>
<section aria-label="Selected position" style="min-width: 0; padding: 16px 18px; background: #F5F7F9; border-radius: 4px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #56646F">Selected position</span>
<h2 style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em">{{flow.insp.title}}</h2>
<span style="font-size: 13.5px; color: #4A5A66">{{flow.insp.sub}}</span>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 14px">
<sc-for list="{{flow.insp.facts}}" as="f"><dt style="color: #4A5A66">{{f.k}}</dt><dd style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px">{{f.v}}</dd></sc-for>
</dl>
<div class="dc-scroll" tabindex="0" role="region" aria-label="Correction chain, a table that scrolls sideways on a narrow screen" style="--dc-bg: #F5F7F9; overflow-x: auto">
<div role="table" aria-label="Correction chain" style="min-width: 290px; display: flex; flex-direction: column; font-size: 13.5px">
<div role="row" style="display: grid; grid-template-columns: minmax(78px, 1.5fr) repeat(4, minmax(50px, 0.8fr)); gap: 6px; padding: 5px 0; border-bottom: 1px solid #D9E0E5; font-size: 12.5px; font-weight: 600; color: #4A5A66"><span role="columnheader">Step</span><span role="columnheader">δ¹⁵N</span><span role="columnheader">change</span><span role="columnheader">δ¹³C</span><span role="columnheader">change</span></div>
<sc-for list="{{flow.insp.chain}}" as="r"><div role="row" style="display: grid; grid-template-columns: minmax(78px, 1.5fr) repeat(4, minmax(50px, 0.8fr)); gap: 6px; padding: 5px 0; border-bottom: 1px solid #ECF0F3"><span role="rowheader" style="color: #3B4A55">{{r.stage}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #0B5E8E; white-space: nowrap">{{r.n}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #56646F; white-space: nowrap">{{r.dn}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #A84600; white-space: nowrap">{{r.c}}</span><span role="cell" style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #56646F; white-space: nowrap">{{r.dc}}</span></div></sc-for>
</div>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 14px">
<sc-for list="{{flow.insp.tail}}" as="f"><dt style="color: #4A5A66">{{f.k}}</dt><dd style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13.5px">{{f.v}}</dd></sc-for>
</dl>
<sc-if value="{{flow.insp.hasFlags}}"><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{flow.insp.flags}}" as="g"><span style="padding: 3px 9px; border-radius: 6px; background: #FBEFD6; color: #6E4700; font-size: 13px">{{g.t}}</span></sc-for></div></sc-if>
<sc-if value="{{flow.insp.noFlags}}"><span style="font-size: 13.5px; color: #4A5A66">No flags at this position.</span></sc-if>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid #D9E0E5">
<button type="button" onClick="{{flow.prev.pick}}" style="font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 10px 16px; border: 1px solid #B9C4CC; border-radius: 4px; background: #FFFFFF; color: #13212B; cursor: pointer" style-hover="border-color: #13212B">{{flow.prev.t}}</button>
<button type="button" onClick="{{flow.next.pick}}" disabled="{{flow.next.busy}}" style="font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 4px; background: #13212B; color: #FFFFFF; cursor: pointer" style-hover="background: #22374B">{{flow.next.t}}</button>
</div>
</div>
</div>
</sc-if>

</main>
<footer class="dc-pad" style="max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 0 24px 40px; font-size: 13px; line-height: 1.5; color: #4A5A66">{{footer}}</footer>
</div>
</template>
</body>
</html>
